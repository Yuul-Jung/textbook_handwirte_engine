<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>판서 엔진 실행 진단</title><style>body{margin:0;background:#f1f2ee;color:#15171c;font:16px/1.7 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px}section{background:white;border:1px solid #ddd;padding:24px;margin:16px 0}button{font:inherit;padding:9px 16px;cursor:pointer}#diagnostic-result{font-weight:600;color:#4635b1}#paper{min-height:280px;background-image:linear-gradient(#eee 1px,transparent 1px),linear-gradient(90deg,#eee 1px,transparent 1px);background-size:24px 24px}</style></head><body><main><section id="diagnostic"><h1>판서 엔진 실행 진단</h1><p id="diagnostic-result" role="status">사용자 스크립트 실행 신호 없음. 설치 및 실행 권한을 확인하고 새로고침하세요.</p><button id="diagnostic-toggle" type="button">판서 켜기 / 끄기</button><p>버튼 또는 F8로 시험합니다. 기존 Alt+Shift+Y도 사용할 수 있습니다. 판서를 끈 다음 버튼을 다시 사용할 수 있는지 확인하세요.</p><p><a href="../">설치 및 업데이트로 돌아가기</a></p></section><section id="paper"><h2>필기 시험 영역</h2><p>이 영역과 좌우 여백에 자유롭게 필기하세요.</p></section></main></body></html>
